<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f9f9f6" />
    <script>try{localStorage.removeItem('untitled-palette');const saved=localStorage.getItem('untitled-theme');const theme=saved==='dark'||saved==='light'?saved:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#181c1a':'#faf9f6'}catch{document.documentElement.dataset.theme='light'}</script>
    <meta name="description" content="Scribb is a home for sketchbooks and journals. Fill tactile digital books with your art and words, share them, and turn a page." />
    <!-- Link cards (X, iMessage, Slack…) need absolute image URLs; scribb.xyz is the production origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scribb" />
    <meta property="og:url" content="https://scribb.xyz/" />
    <meta property="og:title" content="Scribb — Sketchbooks and journals" />
    <meta property="og:description" content="Sketchbooks and journals, made by hand and shared with care." />
    <meta property="og:image" content="https://scribb.xyz/brand/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Scribb logo, a hand-drawn smiling face, beside the word Scribb." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scribb — Sketchbooks and journals" />
    <meta name="twitter:description" content="Sketchbooks and journals, made by hand and shared with care." />
    <meta name="twitter:image" content="https://scribb.xyz/brand/og-card.jpg" />
    <meta name="twitter:image:alt" content="The Scribb logo, a hand-drawn smiling face, beside the word Scribb." />
    <title>Scribb — Sketchbooks and journals</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
