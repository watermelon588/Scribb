<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f9f9f6" />
    <script>try{localStorage.removeItem('untitled-palette');const saved=localStorage.getItem('untitled-theme');const theme=saved==='dark'||saved==='light'?saved:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#181c1a':'#faf9f6'}catch{document.documentElement.dataset.theme='light'}</script>
    <meta name="description" content="A small studio for a different kind of artist portfolio. Explore tactile digital sketchbooks, make one your own, and turn a page." />
    <title>Untitled — Art, collected.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
