# Render Blueprint for the Scribb AI service (free plan, Singapore). Secrets are entered in the Render dashboard.
services:
  - type: web
    name: scribb-ai
    runtime: python
    plan: free
    region: singapore
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn scribb_ai.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: AI_TICKET_SECRET
        sync: false
      - key: AI_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: ALLOWED_ORIGINS
        value: https://scribb.xyz,https://www.scribb.xyz
