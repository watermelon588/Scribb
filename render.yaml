# Only the Python AI service runs on Render. Vercel serves the UI and core API.
services:
  - type: web
    name: scribb-ai
    runtime: python
    plan: free
    region: singapore
    branch: codex/hosting-ready
    rootDir: ai
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scribb_ai.check_config && uvicorn scribb_ai.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: AI_TICKET_SECRET
        sync: false
      - key: AI_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        sync: false
